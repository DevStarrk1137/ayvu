name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.8"

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check dependency lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run tests
        run: uv run --no-sync pytest

  package_smoke:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel and source distribution
        run: uv build --out-dir "${RUNNER_TEMP}/dist"

      - name: Install wheel in an isolated environment
        run: |
          uv venv --python python --no-project "${RUNNER_TEMP}/ayvu-smoke"
          uv pip install \
            --python "${RUNNER_TEMP}/ayvu-smoke/bin/python" \
            "${RUNNER_TEMP}"/dist/*.whl

      - name: Run installed CLI
        run: |
          "${RUNNER_TEMP}/ayvu-smoke/bin/ayvu" --help

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - pytest
      - package_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required jobs
        env:
          PYTEST_RESULT: ${{ needs.pytest.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package_smoke.result }}
        run: |
          echo "pytest: ${PYTEST_RESULT}"
          echo "package smoke: ${PACKAGE_SMOKE_RESULT}"
          test "${PYTEST_RESULT}" = "success"
          test "${PACKAGE_SMOKE_RESULT}" = "success"
